name: terraform-plan

on:
  pull_request:
    paths: ["envs/**", "modules/**", ".github/workflows/**"]

permissions:
  id-token: write       # request the GitHub OIDC token
  contents: read
  pull-requests: write

env:
  # azurerm AND azuread providers read these. No client secret anywhere.
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_IN_AUTOMATION: "true"

jobs:
  validate-and-plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/lab
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: Format check
        run: terraform fmt -check -recursive ../..

      - name: Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=lab.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Validate
        run: terraform validate

      - name: Security scan (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true      # learning mode: report, don't block

      - name: Plan
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan | tee plan.txt

      - name: Post plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('envs/lab/plan.txt', 'utf8').slice(-60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "### Terraform plan\n```\n" + plan + "\n```"
            });
